version: '3.8'

services:
  # Backend service (FastAPI) - Development mode
  backend-dev:
    build:
      context: ./Service
      dockerfile: Dockerfile
    container_name: clearcomply-backend-dev
    environment:
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=True
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot reload
      - ./Service:/app
      - /app/__pycache__
    networks:
      - clearcomply-dev-network
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Frontend service (React) - Development mode
  frontend-dev:
    image: node:18-alpine
    container_name: clearcomply-frontend-dev
    working_dir: /app
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./UI:/app
      - /app/node_modules
    networks:
      - clearcomply-dev-network
    restart: unless-stopped
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      - backend-dev

networks:
  clearcomply-dev-network:
    driver: bridge
