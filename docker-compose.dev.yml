version: '3.8'

services:
  # ── PostgreSQL database ─────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: clearcomply-db
    environment:
      POSTGRES_USER: clearcomply
      POSTGRES_PASSWORD: clearcomply_dev
      POSTGRES_DB: clearcomply
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clearcomply-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearcomply -d clearcomply"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend service (FastAPI) ─────────────────────────────────────────────
  backend-dev:
    build:
      context: ./Service
      dockerfile: Dockerfile
    container_name: clearcomply-backend-dev
    environment:
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=True
      - DATABASE_URL=postgresql://clearcomply:clearcomply_dev@db:5432/clearcomply
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot reload
      - ./Service:/app
      - /app/__pycache__
    networks:
      - clearcomply-dev-network
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # ── Frontend service (React) ──────────────────────────────────────────────
  frontend-dev:
    image: node:18-alpine
    container_name: clearcomply-frontend-dev
    working_dir: /app
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./UI:/app
      - /app/node_modules
    networks:
      - clearcomply-dev-network
    restart: unless-stopped
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      - backend-dev

volumes:
  postgres_data:

networks:
  clearcomply-dev-network:
    driver: bridge
